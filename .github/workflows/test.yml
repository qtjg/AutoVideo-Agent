name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest

  render:
    name: FFmpeg render smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
      - run: python -m pip install -e .
      - name: Render the demo storyboard
        run: autovideo run examples/demo-script.md --output build/ci-demo
      - name: Verify rendered MP4
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          build = Path("build/ci-demo")
          report = json.loads((build / "report.json").read_text(encoding="utf-8"))
          assert report["status"] == "rendered", report
          video = Path(report["video"])
          assert video == (build / "video.mp4").resolve(), report
          assert video.is_file() and video.stat().st_size > 0, report
          PY
